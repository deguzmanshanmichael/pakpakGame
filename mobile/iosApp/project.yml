# XcodeGen spec. Generate the Xcode project with:  cd mobile/iosApp && xcodegen generate
name: PakPak
options:
  bundleIdPrefix: com.shan
  deploymentTarget:
    iOS: "15.0"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    # The Kotlin build step runs Gradle, which Xcode's script sandbox would block.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  PakPak:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # Same game data and audio as Android, copied into the app bundle as "assets/".
      - path: ../shared/src/commonMain/assets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shan.pakpak
        PRODUCT_NAME: PakPak
        INFOPLIST_FILE: iosApp/Info.plist
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(PAKPAK_TEAM_ID)
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "shared"]
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          bash ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    scheme: {}
