# Backend tests + Android build and tests (including the live client<->server integration test).
name: Android & backend

on:
  push:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Start backend for the integration test
        working-directory: backend
        run: |
          SERVER_SECRET=ci-secret-ci-secret-ci DB_PATH=./data/ci.db PORT=8080 HOST=127.0.0.1 RATE_LIMIT_SCALE=20 QUIET=1 \
            node --disable-warning=ExperimentalWarning src/server.js &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 1; done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android tests and debug APK
        working-directory: mobile
        run: bash ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest :androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PakPak-android-debug
          path: mobile/dist/PakPak-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: mobile/androidApp/build/screens/
